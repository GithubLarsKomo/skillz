name: Materialize technology offer question set

on:
  push:
    branches:
      - feat/technology-offer-assessment-question-set

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/technology-offer-assessment-question-set
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize canonical generated files
        run: |
          set -euxo pipefail
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Commit generated files
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore: refresh generated skill metadata [materialized]'
          git push origin HEAD:feat/technology-offer-assessment-question-set

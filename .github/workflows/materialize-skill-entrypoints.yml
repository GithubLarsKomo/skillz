name: Materialize skill entrypoints

on:
  pull_request:
  push:
    branches: [agent/skill-entrypoint-discovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/skill-entrypoint-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize curated entrypoint metadata
        run: python scripts/materialize_skill_entrypoints.py
      - name: Test capability index and discovery queries
        run: |
          python -m unittest tests.test_generate_capability_index -v
          python -m unittest tests.test_query_capabilities -v
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills README.md .skill-sync.json docs/skill-capability-index.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Materialize user-facing skill entrypoints'
            git push origin HEAD:agent/skill-entrypoint-discovery
          fi

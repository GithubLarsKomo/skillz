name: Refresh Dr Komorowski sport skill metadata

on:
  push:
    branches:
      - feat/dr-komorowski-sport-report-skills

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate canonical repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Validate generated plugin bundle
        run: python scripts/build_openai_plugin.py --output /tmp/skillz-plugin
      - name: Commit generated metadata
        shell: bash
        run: |
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .skill-sync.json docs obsidian skills/*/agents/openai.yaml
          git commit -m 'Refresh generated metadata for sport skills'
          git push

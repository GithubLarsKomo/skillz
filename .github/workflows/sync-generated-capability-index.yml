name: Sync generated capability index

on:
  push:
    branches:
      - feat/impeccable-corporate-color-palettes

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/impeccable-corporate-color-palettes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Commit generated capability index
        run: |
          if git diff --quiet -- docs/skill-capability-index.json; then
            echo "Capability index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skill-capability-index.json
          git commit -m "Regenerate capability index after evaluation repair"
          git push origin HEAD:feat/impeccable-corporate-color-palettes

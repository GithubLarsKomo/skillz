name: Materialize complementary customer service wave

on:
  push:
    branches:
      - agent/customer-service-quality-coding-hardening

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-service-quality-coding-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore only complementary skills from reviewed backup
        run: |
          git fetch origin agent/customer-service-quality-coding-hardening-pre-followup-dedupe
          git checkout origin/agent/customer-service-quality-coding-hardening-pre-followup-dedupe -- \
            skills/medical-device-service-report-quality-routing \
            skills/medical-device-adverse-event-coding
      - name: Clarify ownership boundary against merged customer follow-up skill
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('skills/medical-device-service-report-quality-routing/SKILL.md')
          text = p.read_text(encoding='utf-8')
          needle = ('Er ersetzt weder den allgemeinen Kundenkontakt-Intake noch Complaint Investigation, CAPA, Risk Management, PMS, FDA MDR oder EU/IVDR Vigilance. '
                    'Er bewertet ausschließlich, welche Service-Evidenz erhalten werden muss und welche Quality-/Complaint-/Safety-Handoffs aus dem Serviceereignis entstehen.\n')
          replacement = needle + ('\nBei bereits eröffnetem Complaint besitzt `medical-device-complaint-customer-followup` die kundenbezogenen Rückfragen, externe Customer-Kommunikation und Return-Follow-up-Steuerung. Dieser Skill bleibt dagegen Owner der Service-Source-, Interventions-, Evidence-Preservation- und Quality-Routing-Sicht und dupliziert den Customer-Follow-up-Loop nicht.\n')
          if needle not in text:
              raise SystemExit('service ownership boundary anchor not found')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Materialize canonical metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
      - name: Commit restored skills and generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md \
            skills/medical-device-service-report-quality-routing \
            skills/medical-device-adverse-event-coding
          if git diff --cached --quiet; then
            echo "No changes to materialize"
            exit 0
          fi
          git commit -m "Add complementary service routing and adverse-event coding skills"
          git push origin HEAD:agent/customer-service-quality-coding-hardening

name: Materialize dependency graph

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/dependency-graphs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dependency-graphs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate dependency graph artifacts
        run: python scripts/generate_dependency_graph.py
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md
          git commit -m "Generate dependency graph artifacts"
          git push origin HEAD:agent/dependency-graphs

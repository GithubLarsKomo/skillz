name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated repository metadata
        run: python scripts/generate_repository_metadata.py --check
      - name: Test metadata generator
        run: python -m unittest tests.test_generate_repository_metadata
      - name: Test dependency graph generator
        run: python -m unittest tests.test_generate_dependency_graph
      - name: Test capability index generator
        run: python -m unittest tests.test_generate_capability_index
      - name: Test capability index query CLI
        run: python -m unittest tests.test_query_capabilities
      - name: Test structured capability resolver
        run: python -m unittest tests.test_resolve_capabilities
      - name: Test capability intent compiler
        run: python -m unittest tests.test_compile_capability_intent
      - name: Test capability intent envelope
        run: python -m unittest tests.test_capability_intent_envelope
      - name: Test capability intent admission
        run: python -m unittest tests.test_admit_capability_intent
      - name: Test model interpretation adapter
        run: python -m unittest tests.test_adapt_model_interpretation
      - name: Test interpretation benchmark scorer
        run: python -m unittest tests.test_score_capability_interpretations
      - name: Score interpretation benchmark baseline
        run: python scripts/score_capability_interpretations.py benchmarks/capability-interpretation-v1.json benchmarks/capability-interpretation-baseline-v1.json --json
      - name: Test model interpretation request builder
        run: python -m unittest tests.test_build_model_interpretation_request
      - name: Test capability pipeline end to end
        run: python -m unittest tests.test_capability_pipeline_e2e
      - name: Test capability pipeline CLI
        run: python -m unittest tests.test_run_capability_pipeline
      - name: Test metadata schema validator
        run: python -m unittest tests.test_validate_metadata_schemas
      - name: Validate metadata schema contracts
        run: python scripts/validate_metadata_schemas.py
      - name: Validate repository contracts
        run: python scripts/validate_skills.py
      - name: Test unified evaluation runner
        run: python -m unittest tests.test_evaluate_skills
      - name: Evaluate skill suites
        run: python scripts/evaluate_skills.py

name: Temporary branch synchronization

on:
  push:
    branches: [agent/opaque-system-analysis]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opaque-system-analysis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge main and regenerate metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(README\.md|\.skill-sync\.json|docs/skill-dependency-graph\.json|docs/SKILL-DEPENDENCIES\.md|docs/skill-capability-index\.json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            for path in README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json; do
              if git ls-files -u -- "$path" | grep -q .; then
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
            python scripts/generate_repository_metadata.py
            git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json
            git commit -m "merge main and refresh generated metadata"
          else
            python scripts/generate_repository_metadata.py
            git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json
            if ! git diff --cached --quiet; then
              git commit -m "refresh generated metadata after main sync"
            fi
          fi
          git push origin HEAD:agent/opaque-system-analysis

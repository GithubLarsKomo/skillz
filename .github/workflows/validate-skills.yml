name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regulatory-fda-pccp-recall-registration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify evaluations before generation
        run: python scripts/evaluate_skills.py
      - name: Materialize OpenAI metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py
          python scripts/materialize_openai_agent_metadata.py --check
      - name: Generate canonical repository metadata
        run: |
          python scripts/generate_repository_metadata.py
          python scripts/generate_repository_metadata.py --check
          git diff --check
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Regenerate repository metadata"
            git push origin HEAD:agent/regulatory-fda-pccp-recall-registration
          fi

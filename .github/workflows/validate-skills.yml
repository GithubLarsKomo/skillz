name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regulatory-wave1-evidence-mdcg-ivdr
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Temporary materialize canonical repository metadata
        run: |
          python scripts/evaluate_skills.py
          python scripts/generate_repository_metadata.py
          python scripts/generate_repository_metadata.py --check
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md
            git commit -m "Regenerate regulatory capability metadata [generated]"
            git push origin HEAD:agent/regulatory-wave1-evidence-mdcg-ivdr
          fi
      - name: Test skillz bootstrap installer
        run: python -m unittest tests.test_bootstrap_skillz
      - name: Test clean-room beta installation path
        run: python -m unittest tests.test_beta_cleanroom
      - name: Test beta version and reproducible release bundle
        run: python -m unittest tests.test_release_bundle
      - name: Validate per-skill OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py --check
      - name: Test OpenAI plugin distribution
        run: python -m unittest tests.test_build_openai_plugin
      - name: Check generated repository metadata
        run: python scripts/generate_repository_metadata.py --check
      - name: Test metadata generator
        run: python -m unittest tests.test_generate_repository_metadata
      - name: Test dependency graph generator
        run: python -m unittest tests.test_generate_dependency_graph
      - name: Test capability index generator
        run: python -m unittest tests.test_generate_capability_index
      - name: Test capability index query CLI
        run: python -m unittest tests.test_query_capabilities
      - name: Test structured capability resolver
        run: python -m unittest tests.test_resolve_capabilities
      - name: Test capability intent compiler
        run: python -m unittest tests.test_compile_capability_intent
      - name: Test capability intent envelope
        run: python -m unittest tests.test_capability_intent_envelope
      - name: Test capability intent admission
        run: python -m unittest tests.test_admit_capability_intent
      - name: Test model interpretation adapter
        run: python -m unittest tests.test_adapt_model_interpretation
      - name: Test interpretation benchmark scorer
        run: python -m unittest tests.test_score_capability_interpretations
      - name: Score interpretation benchmark baseline
        run: python scripts/score_capability_interpretations.py benchmarks/capability-interpretation-v1.json benchmarks/capability-interpretation-baseline-v1.json --json
      - name: Test model interpretation request builder
        run: python -m unittest tests.test_build_model_interpretation_request
      - name: Test model interpretation runner
        run: python -m unittest tests.test_run_model_interpretation
      - name: Test model runner provider modes
        run: python -m unittest tests.test_model_runner_provider_modes
      - name: Test offline model capability pipeline
        run: python -m unittest tests.test_run_model_capability_pipeline
      - name: Test provider qualification gate
        run: python -m unittest tests.test_qualify_model_provider
      - name: Qualify committed benchmark baseline
        run: python scripts/qualify_model_provider.py fixture fixture-model benchmarks/capability-interpretation-v1.json benchmarks/capability-interpretation-baseline-v1.json docs/skill-capability-index.json
      - name: Test OpenAI-compatible provider adapter
        run: python -m unittest tests.test_openai_compatible_provider
      - name: Test provider endpoint security boundaries
        run: python -m unittest tests.test_provider_endpoint_security
      - name: Test provider identity key
        run: python -m unittest tests.test_provider_identity_key
      - name: Test live provider validation runner offline
        run: python -m unittest tests.test_run_live_provider_validation
      - name: Test provider promotion bundle
        run: python -m unittest tests.test_provider_promotion_bundle
      - name: Test registry promotion preparer
        run: python -m unittest tests.test_prepare_registry_promotion
      - name: Test provider qualification registry
        run: python -m unittest tests.test_qualification_registry
      - name: Verify provider qualification registry
        run: python scripts/qualification_registry.py verify
      - name: Test provider config registry
        run: python -m unittest tests.test_provider_config_registry
      - name: Verify provider config registry
        run: python scripts/provider_config_registry.py verify
      - name: Test exact registry-pair runner flow
        run: python -m unittest tests.test_runner_registry_pair
      - name: Test capability pipeline end to end
        run: python -m unittest tests.test_capability_pipeline_e2e
      - name: Test capability pipeline CLI
        run: python -m unittest tests.test_run_capability_pipeline
      - name: Test toolchain capability probe
        run: python -m unittest tests.test_probe_toolchain
      - name: Test metadata schema validator
        run: python -m unittest tests.test_validate_metadata_schemas
      - name: Test knowledge artifact schemas
        run: python -m unittest tests.test_knowledge_schemas
      - name: Validate metadata schema contracts
        run: python scripts/validate_metadata_schemas.py
      - name: Test regulated engineering contracts
        run: python -m unittest tests.test_regulated_engineering_contracts
      - name: Test regulated engineering end-to-end contracts
        run: python -m unittest tests.test_regulated_engineering_e2e
      - name: Validate repository contracts
        run: python scripts/validate_skills.py
      - name: Test unified evaluation runner
        run: python -m unittest tests.test_evaluate_skills
      - name: Evaluate skill suites
        run: python scripts/evaluate_skills.py

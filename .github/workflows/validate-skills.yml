name: Validate skills

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate all skill suites before materialization
        run: python scripts/evaluate_skills.py
      - name: Materialize canonical OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate canonical repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Verify generated repository metadata is stable
        run: python scripts/generate_repository_metadata.py --check
      - name: Verify OpenAI agent metadata is stable
        run: python scripts/materialize_openai_agent_metadata.py --check
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .skill-sync.json README.md docs/CAPABILITY-HEALTH.md docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/skill-dependency-graph.json skills/*/agents/openai.yaml
          if git diff --cached --quiet; then
            echo "No generated metadata changes"
          else
            git commit -m "Regenerate repository metadata"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

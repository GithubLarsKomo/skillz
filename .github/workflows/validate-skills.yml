name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regulatory-fda-denovo-qsub
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify evaluations before generation
        run: python scripts/evaluate_skills.py
      - name: Generate canonical repository metadata
        run: |
          python scripts/generate_repository_metadata.py
          python scripts/generate_repository_metadata.py --check
          git diff --check
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md
          git commit -m "Regenerate FDA De Novo capability metadata [generated]"
          git push origin HEAD:agent/regulatory-fda-denovo-qsub

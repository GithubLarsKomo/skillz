name: Temporary materialize memory paths

on:
  push:
    branches: [agent/regulatory-wave1-chain1-memory]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[memory paths generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regulatory-wave1-chain1-memory
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Memory Path section to every skill
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('skills')
          generic = '''\n\n## Memory Path\n\nAt completion, extract only confirmed, reusable, non-sensitive learnings that remain useful beyond the current run. Current task state, open follow-ups, tool snapshots, speculative hypotheses, secrets, sensitive personal data and raw connector payloads remain run-only. Encode eligible candidates using `memory-candidate-handoff-v1` from `docs/MEMORY-PATH-CONTRACT.md`, preserve provenance and freshness, and pass the ephemeral handoff to `communication-memory-governance`. The producing skill does not persist memory and never claims persistence succeeded without confirmation from the memory layer.\n'''
          governance = '''\n\n## Memory Path\n\nThis skill is the terminal governance owner for memory candidates. It validates `memory-candidate-handoff-v1`, applies durability, sensitivity, scope, provenance, confirmation, conflict, supersession, expiry and forget rules, and only then updates the communication profile or memory ledger. It does not re-handoff candidates to itself and never treats current task state or volatile unreviewed regulatory snapshots as durable memory.\n'''
          factory = '''\n\n## Memory Path\n\nEvery skill created or materially revised by this factory must include a `## Memory Path` section and follow `docs/MEMORY-PATH-CONTRACT.md`. The author must specify eligible durable learnings, run-only information, provenance/freshness requirements, the ephemeral `memory-candidate-handoff-v1` handoff to `communication-memory-governance`, and the rule that the producing skill does not own or assume persistence. Missing Memory Path is an incomplete skill contract.\n'''

          for path in sorted(root.glob('*/SKILL.md')):
              text = path.read_text(encoding='utf-8')
              if '\n## Memory Path\n' in text:
                  continue
              name = path.parent.name
              section = governance if name == 'communication-memory-governance' else factory if name == 'composable-skill-factory' else generic
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          roadmap = Path('docs/REGULATORY-CAPABILITY-ROADMAP.md')
          if roadmap.exists():
              text = roadmap.read_text(encoding='utf-8')
              needle = '10. **Invocation defaults**: specialist evidence workers may be implicit when their trigger is unambiguous; pathway selection, irreversible regulatory strategy and external submission/commitment skills default to explicit invocation.\n'
              addition = needle + '11. **Governed memory path**: every skill exposes only confirmed reusable learnings through `memory-candidate-handoff-v1` to `communication-memory-governance`; transient run state stays run-only and volatile regulatory facts require source, `asOf` and review/expiry semantics.\n'
              if needle in text and '11. **Governed memory path**' not in text:
                  roadmap.write_text(text.replace(needle, addition), encoding='utf-8')
          PY
      - name: Regenerate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Commit generated memory paths
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills docs README.md .skill-sync.json
          git commit -m "Materialize governed memory paths [memory paths generated]"
          git push origin HEAD:agent/regulatory-wave1-chain1-memory

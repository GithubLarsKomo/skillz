name: Validate EUROIMMUN report PR

on:
  push:
    branches:
      - feat/euroimmun-docx-pdf-level2-reference

permissions:
  contents: read

jobs:
  validate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated repository metadata
        run: python scripts/generate_repository_metadata.py --check
      - name: Validate OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py --check
      - name: Test corporate design contract
        run: python -m unittest tests.test_euroimmun_corporate_design_contract
      - name: Test corporate Golden Reference
        run: python -m unittest tests.test_euroimmun_corporate_design_golden_reference
      - name: Test DOCX PDF Level-2 reference
        run: python -m unittest tests.test_euroimmun_docx_pdf_level2_reference
      - name: Validate repository contracts
        run: python scripts/validate_skills.py

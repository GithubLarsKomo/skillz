name: Materialize YouTube Learner feature

on:
  push:
    branches: [feat/youtube-learning-workflow]

permissions:
  contents: write

concurrency:
  group: youtube-learning-feature-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test YouTube Learner contract
        run: python -m unittest tests.test_youtube_learning_contract
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build committed OpenAI plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$GITHUB_SHA"
      - name: Verify generated metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py --check
          python scripts/generate_repository_metadata.py --check
      - name: Validate repository contracts
        run: python scripts/validate_skills.py
      - name: Evaluate skill suites
        run: python scripts/evaluate_skills.py
      - name: Commit generated feature artifacts and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/youtube-learning-feature-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .skill-sync.json \
            docs/skill-dependency-graph.json \
            docs/SKILL-DEPENDENCIES.md \
            docs/skill-capability-index.json \
            docs/CAPABILITY-HEALTH.md \
            obsidian \
            plugins/skillz \
            skills/*/SKILL.md \
            skills/*/agents/openai.yaml \
            .github/workflows/youtube-learning-feature-sync.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Materialize YouTube Learner metadata"
          git push origin HEAD:"$GITHUB_REF_NAME"

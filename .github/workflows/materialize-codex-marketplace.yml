name: Materialize Codex marketplace

on:
  push:
    branches:
      - agent/codex-marketplace-distribution
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build committed Codex plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Commit generated bundle when changed
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git add plugins/skillz
          if git diff --cached --quiet; then
            echo "Codex marketplace bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Codex marketplace bundle"
          git push origin HEAD:"${TARGET_BRANCH}"

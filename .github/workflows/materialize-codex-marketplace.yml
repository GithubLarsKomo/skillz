name: Materialize Codex marketplace

on:
  push:
    branches:
      - agent/codex-marketplace-distribution

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build committed Codex plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Commit generated bundle when changed
        shell: bash
        run: |
          if git diff --quiet -- plugins/skillz && git diff --cached --quiet; then
            echo "Codex marketplace bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/skillz
          git commit -m "Materialize Codex marketplace bundle"
          git push origin HEAD:${{ github.ref_name }}

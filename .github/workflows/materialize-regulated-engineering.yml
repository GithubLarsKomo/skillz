name: Materialize regulated engineering extension

on:
  push:
    branches: [agent/regulated-engineering-extension]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/regulated-engineering-extension
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize extension
        run: python scripts/materialize_regulated_engineering.py
      - name: Generate canonical metadata
        run: python scripts/generate_repository_metadata.py
      - name: Validate repository metadata and skills
        run: |
          python scripts/validate_metadata_schemas.py
          python scripts/validate_skills.py
          python scripts/evaluate_skills.py
          python -m unittest tests.test_regulated_engineering_contracts tests.test_regulated_engineering_e2e
      - name: Commit generated extension
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills contracts docs benchmarks tests .skill-sync.json README.md .github/workflows/validate-skills.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Materialize regulated engineering extension'
            git push origin HEAD:agent/regulated-engineering-extension
          fi

name: Sync PR generated metadata

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build committed OpenAI plugin bundle
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$SOURCE_SHA"
      - name: Verify generated metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py --check
          python scripts/generate_repository_metadata.py --check
      - name: Commit generated artifacts to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .skill-sync.json \
            docs/skill-dependency-graph.json \
            docs/SKILL-DEPENDENCIES.md \
            docs/skill-capability-index.json \
            docs/CAPABILITY-HEALTH.md \
            obsidian \
            plugins/skillz \
            skills/*/SKILL.md \
            skills/*/agents/openai.yaml
          git commit -m "Regenerate skill repository artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

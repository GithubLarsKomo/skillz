name: Sync generated metadata

on:
  push:
    branches: [main, feat/skillz-architecture-consolidation]
    paths:
      - "skills/**"
      - "benchmarks/**"
      - "scripts/materialize_openai_agent_metadata.py"
      - "scripts/generate_repository_metadata.py"
      - "scripts/generate_dependency_graph.py"
      - "scripts/generate_capability_index.py"
      - "scripts/generate_capability_health.py"
      - "scripts/generate_obsidian_skill_universe.py"
      - "scripts/build_openai_plugin.py"
      - "scripts/finalize_architecture_consolidation_p0.py"
      - "scripts/apply_architecture_consolidation_p1_source_spine.py"
      - "scripts/apply_architecture_consolidation_p1_learning_delivery.py"
      - "scripts/apply_architecture_consolidation_p1_presentation_evaluations.py"
      - "scripts/apply_architecture_consolidation_p1_user_learning_evaluations.py"
      - "scripts/fix_architecture_consolidation_p1_evaluation_anchors.py"
      - "distribution/openai-plugin/**"
      - "VERSION"
      - ".github/workflows/sync-generated-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-generated-metadata-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependency graph contracts
        run: python -m unittest tests.test_generate_dependency_graph
      - name: Test metadata schema validator
        run: python -m unittest tests.test_validate_metadata_schemas
      - name: Test role selection artifact schemas
        run: python -m unittest tests.test_role_selection_artifact_schemas
      - name: Test role selection routing policy
        run: python -m unittest tests.test_role_selection_routing_policy
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Apply P1 source-context spine
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/apply_architecture_consolidation_p1_source_spine.py
      - name: Apply P1 shared learning delivery
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/apply_architecture_consolidation_p1_learning_delivery.py
      - name: Backfill P1 presentation evaluations
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/apply_architecture_consolidation_p1_presentation_evaluations.py
      - name: Backfill P1 user-facing learning evaluations
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/apply_architecture_consolidation_p1_user_learning_evaluations.py
      - name: Correct P1 evaluation anchors
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/fix_architecture_consolidation_p1_evaluation_anchors.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Evaluate backfilled suites
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/evaluate_skills.py
      - name: Finalize architecture consolidation P0
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python scripts/finalize_architecture_consolidation_p0.py
      - name: Verify P1 source-context spine
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python -m unittest tests.test_architecture_consolidation_p1_source_spine
      - name: Verify P1 shared learning delivery
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python -m unittest tests.test_architecture_consolidation_p1_learning_delivery
      - name: Verify P1 generic document core
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python -m unittest tests.test_architecture_consolidation_p1_document_core
      - name: Verify P1 presentation evaluation coverage
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python -m unittest tests.test_architecture_consolidation_p1_presentation_evaluations
      - name: Verify user-facing evaluation coverage
        if: github.ref_name == 'feat/skillz-architecture-consolidation'
        run: python -m unittest tests.test_architecture_consolidation_p1_user_evaluation_coverage
      - name: Build committed OpenAI plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$GITHUB_SHA"
      - name: Verify OpenAI agent metadata is reproducible
        run: python scripts/materialize_openai_agent_metadata.py --check
      - name: Verify generated metadata is reproducible
        run: python scripts/generate_repository_metadata.py --check
      - name: Test Obsidian skill universe generator
        run: python -m unittest tests.test_generate_obsidian_skill_universe
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .skill-sync.json \
            docs/SKILL-UNIVERSE.md \
            docs/skill-dependency-graph.json \
            docs/SKILL-DEPENDENCIES.md \
            docs/skill-capability-index.json \
            docs/CAPABILITY-HEALTH.md \
            obsidian \
            plugins/skillz \
            skills/*/SKILL.md \
            skills/*/tests \
            skills/*/agents/openai.yaml
          git commit -m "Regenerate skill repository artifacts"
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Validate repository contracts
        run: python scripts/validate_skills.py
      - name: Evaluate skill suites
        run: python scripts/evaluate_skills.py

name: Materialize generated state snapshot

on:
  push:
    branches:
      - feat/sport-docx-pdf-report-pipeline

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sport-docx-pdf-report-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate repository metadata and plugin
        run: |
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Upload exact generated state
        uses: actions/upload-artifact@v4
        with:
          name: exact-generated-state
          path: |
            .skill-sync.json
            README.md
            docs
            plugins/skillz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

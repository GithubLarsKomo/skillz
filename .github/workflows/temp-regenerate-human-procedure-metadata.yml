name: Temporary regenerate human procedure metadata

on:
  push:
    branches: [agent/human-procedure-wizard]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[generated metadata]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/human-procedure-wizard
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Commit generated metadata
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/SKILL-DEPENDENCIES.md docs/skill-dependency-graph.json docs/skill-capability-index.json
          git commit -m "Regenerate repository metadata [generated metadata]"
          git push origin HEAD:agent/human-procedure-wizard

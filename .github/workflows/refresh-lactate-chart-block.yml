name: Refresh lactate chart block

on:
  push:
    branches:
      - feat/lactate-chart-block

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check reportlab
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Validate and render chart example
        run: |
          python -m json.tool skills/dr-komorowski-sport-report-renderer/assets/report-spec.lactate-chart.example.json >/dev/null
          python skills/dr-komorowski-sport-report-renderer/scripts/render_report.py \
            skills/dr-komorowski-sport-report-renderer/assets/report-spec.lactate-chart.example.json \
            /tmp/dr-komorowski-lactate-chart.pdf
          test -s /tmp/dr-komorowski-lactate-chart.pdf
          pdfinfo /tmp/dr-komorowski-lactate-chart.pdf | grep -q 'Pages:'
          pdftoppm -png -f 2 -singlefile -r 120 /tmp/dr-komorowski-lactate-chart.pdf /tmp/chart-preview
          test -s /tmp/chart-preview.png
      - name: Check chart validation failure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('skills/dr-komorowski-sport-report-renderer/assets/report-spec.lactate-chart.example.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          chart = data['sections'][0]['blocks'][1]
          chart['threshold_bands'][0]['working_w'] = 190
          Path('/tmp/invalid-chart.json').write_text(json.dumps(data), encoding='utf-8')
          PY
          if python skills/dr-komorowski-sport-report-renderer/scripts/render_report.py /tmp/invalid-chart.json /tmp/invalid.pdf 2>/tmp/chart-error.txt; then
            echo 'Renderer unexpectedly accepted invalid LT working value.' >&2
            exit 1
          fi
          grep -q 'working_w must lie within the band' /tmp/chart-error.txt
      - name: Refresh canonical repository metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Validate repository
        run: |
          python -m unittest tests.test_build_openai_plugin
          python scripts/validate_skills.py
          python scripts/evaluate_skills.py
          python scripts/generate_repository_metadata.py --check
          git diff --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .skill-sync.json docs obsidian plugins/skillz skills/*/agents/openai.yaml
          git commit -m 'Refresh metadata for lactate chart block'
          git push

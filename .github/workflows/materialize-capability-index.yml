name: Materialize capability index

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/capability-index' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-index
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate capability index
        run: python scripts/generate_capability_index.py
      - name: Commit generated artifact
        run: |
          if git diff --quiet -- docs/skill-capability-index.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skill-capability-index.json
          git commit -m "Generate capability index artifact"
          git push origin HEAD:agent/capability-index

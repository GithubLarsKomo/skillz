name: Migrate skill frontmatter

on:
  push:
    branches:
      - agent/migrate-skill-frontmatter

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/migrate-skill-frontmatter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate metadata and refresh hashes
        run: python scripts/migrate_skill_frontmatter.py
      - name: Validate migrated repository
        run: |
          python scripts/validate_skills.py
          python scripts/verify_generated.py
      - name: Remove one-time migration machinery
        run: |
          rm scripts/migrate_skill_frontmatter.py
          rm .github/workflows/migrate-skill-frontmatter.yml
      - name: Commit migrated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills .skill-sync.json scripts/migrate_skill_frontmatter.py .github/workflows/migrate-skill-frontmatter.yml
          git commit -m "chore: migrate skill frontmatter metadata"
          git push origin HEAD:agent/migrate-skill-frontmatter

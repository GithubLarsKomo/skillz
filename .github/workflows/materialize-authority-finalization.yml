name: Materialize authority finalization metadata

on:
  push:
    branches:
      - agent/field-action-authority-finalization

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/field-action-authority-finalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize canonical metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md skills/*/SKILL.md skills/*/agents/openai.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate authority finalization metadata"
          git push origin HEAD:agent/field-action-authority-finalization

name: Leadership coaching branch metadata sync

on:
  push:
    branches:
      - feat/leadership-coaching-core

permissions:
  contents: write

concurrency:
  group: leadership-coaching-branch-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leadership-coaching-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate new leadership artifact schemas
        run: python -m unittest tests.test_leadership_coaching_artifact_schemas
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build committed OpenAI plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$GITHUB_SHA"
      - name: Verify generated state
        run: |
          python scripts/materialize_openai_agent_metadata.py --check
          python scripts/generate_repository_metadata.py --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md obsidian plugins/skillz skills/*/SKILL.md skills/*/agents/openai.yaml
          git commit -m "Regenerate leadership coaching repository artifacts"
          git push origin HEAD:feat/leadership-coaching-core

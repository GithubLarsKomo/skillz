name: Refresh lactate report template

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and render lactate template
        run: |
          python -m json.tool skills/dr-komorowski-sport-report-renderer/assets/report-spec.lactate-test.example.json >/dev/null
          python -m pip install --disable-pip-version-check reportlab
          python skills/dr-komorowski-sport-report-renderer/scripts/render_report.py \
            skills/dr-komorowski-sport-report-renderer/assets/report-spec.lactate-test.example.json \
            /tmp/dr-komorowski-lactate-test-example.pdf
          test -s /tmp/dr-komorowski-lactate-test-example.pdf
      - name: Refresh canonical repository metadata
        run: |
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Validate repository
        run: |
          python -m unittest tests.test_build_openai_plugin
          python scripts/validate_skills.py
          python scripts/evaluate_skills.py
          python scripts/generate_repository_metadata.py --check
      - name: Commit generated artifacts
        shell: bash
        run: |
          git diff --check
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .skill-sync.json docs obsidian plugins/skillz skills/*/agents/openai.yaml
          git commit -m 'Refresh metadata for lactate report template'
          git push

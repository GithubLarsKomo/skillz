name: Materialize frontend design branch

on:
  push:
    branches: [feat/personal-frontend-design]
    paths:
      - ".frontend-design-materialize-trigger"

permissions:
  contents: write

concurrency:
  group: materialize-frontend-design-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: dep
        name: Test dependency graph contracts
        continue-on-error: true
        run: python -m unittest tests.test_generate_dependency_graph
      - id: schema
        name: Test metadata schema validator
        continue-on-error: true
        run: python -m unittest tests.test_validate_metadata_schemas
      - id: role_schema
        name: Test role selection artifact schemas
        continue-on-error: true
        run: python -m unittest tests.test_role_selection_artifact_schemas
      - id: role_policy
        name: Test role selection routing policy
        continue-on-error: true
        run: python -m unittest tests.test_role_selection_routing_policy
      - id: materialize_agents
        name: Materialize OpenAI agent metadata
        continue-on-error: true
        run: python scripts/materialize_openai_agent_metadata.py
      - id: generate
        name: Generate repository metadata
        continue-on-error: true
        run: python scripts/generate_repository_metadata.py
      - id: build_plugin
        name: Build committed OpenAI plugin bundle
        continue-on-error: true
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$GITHUB_SHA"
      - id: agent_check
        name: Verify OpenAI agent metadata is reproducible
        continue-on-error: true
        run: python scripts/materialize_openai_agent_metadata.py --check
      - id: metadata_check
        name: Verify generated metadata is reproducible
        continue-on-error: true
        run: python scripts/generate_repository_metadata.py --check
      - id: validate
        name: Validate repository contracts
        continue-on-error: true
        run: python scripts/validate_skills.py
      - id: evaluate
        name: Evaluate skill suites
        continue-on-error: true
        run: python scripts/evaluate_skills.py
      - name: Record outcome and commit valid generated artifacts
        if: always()
        shell: bash
        env:
          DEP: ${{ steps.dep.outcome }}
          SCHEMA: ${{ steps.schema.outcome }}
          ROLE_SCHEMA: ${{ steps.role_schema.outcome }}
          ROLE_POLICY: ${{ steps.role_policy.outcome }}
          MATERIALIZE_AGENTS: ${{ steps.materialize_agents.outcome }}
          GENERATE: ${{ steps.generate.outcome }}
          BUILD_PLUGIN: ${{ steps.build_plugin.outcome }}
          AGENT_CHECK: ${{ steps.agent_check.outcome }}
          METADATA_CHECK: ${{ steps.metadata_check.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          EVALUATE: ${{ steps.evaluate.outcome }}
        run: |
          cat > .frontend-design-materialize-status <<EOF
          dependency_graph=$DEP
          metadata_schema=$SCHEMA
          role_schema=$ROLE_SCHEMA
          role_policy=$ROLE_POLICY
          materialize_agents=$MATERIALIZE_AGENTS
          generate_metadata=$GENERATE
          build_plugin=$BUILD_PLUGIN
          agent_metadata_check=$AGENT_CHECK
          generated_metadata_check=$METADATA_CHECK
          validate_skills=$VALIDATE
          evaluate_skills=$EVALUATE
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .frontend-design-materialize-status
          all_ok=true
          for value in "$DEP" "$SCHEMA" "$ROLE_SCHEMA" "$ROLE_POLICY" "$MATERIALIZE_AGENTS" "$GENERATE" "$BUILD_PLUGIN" "$AGENT_CHECK" "$METADATA_CHECK" "$VALIDATE" "$EVALUATE"; do
            if [ "$value" != "success" ]; then all_ok=false; fi
          done
          if [ "$all_ok" = true ]; then
            git add \
              README.md \
              .skill-sync.json \
              docs/skill-dependency-graph.json \
              docs/SKILL-DEPENDENCIES.md \
              docs/skill-capability-index.json \
              docs/CAPABILITY-HEALTH.md \
              obsidian \
              plugins/skillz \
              skills/*/SKILL.md \
              skills/*/agents/openai.yaml
            message="Regenerate frontend design skill artifacts"
          else
            message="Record frontend design materialization diagnostics"
          fi
          git commit -m "$message"
          git push origin HEAD:"$GITHUB_REF_NAME"

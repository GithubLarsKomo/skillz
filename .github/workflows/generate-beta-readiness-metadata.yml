name: Generate beta readiness metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Upload generated metadata
        uses: actions/upload-artifact@v4
        with:
          name: beta-readiness-generated-metadata
          path: |
            README.md
            .skill-sync.json
            docs/skill-dependency-graph.json
            docs/SKILL-DEPENDENCIES.md
            docs/skill-capability-index.json
          if-no-files-found: error

name: Sync Impeccable corporate color feature

on:
  push:
    branches:
      - feat/impeccable-corporate-color-palettes

permissions:
  contents: write

concurrency:
  group: sync-impeccable-corporate-color-feature-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test corporate palette converter
        run: python -m unittest tests.test_ase_to_tokens
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Diagnose portable UTF-8 files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          bad = []
          for skill_dir in sorted((Path("skills")).iterdir()):
              if not skill_dir.is_dir():
                  continue
              files = [skill_dir / "SKILL.md"]
              for dirname in ("agents", "assets", "references", "scripts"):
                  base = skill_dir / dirname
                  if base.exists():
                      files.extend(sorted(path for path in base.rglob("*") if path.is_file()))
              for path in files:
                  try:
                      path.read_text(encoding="utf-8")
                  except UnicodeDecodeError as exc:
                      bad.append((path, exc))
          for path, exc in bad:
              print(f"NON_UTF8: {path}: {exc}")
          if bad:
              raise SystemExit(2)
          print("All portable skill files are UTF-8 text.")
          PY
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build committed OpenAI plugin bundle
        run: python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$GITHUB_SHA"
      - name: Verify OpenAI agent metadata is reproducible
        run: python scripts/materialize_openai_agent_metadata.py --check
      - name: Verify generated metadata is reproducible
        run: python scripts/generate_repository_metadata.py --check
      - name: Validate repository contracts
        run: python scripts/validate_skills.py
      - name: Evaluate skill suites
        run: python scripts/evaluate_skills.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .skill-sync.json \
            docs/skill-dependency-graph.json \
            docs/SKILL-DEPENDENCIES.md \
            docs/skill-capability-index.json \
            docs/CAPABILITY-HEALTH.md \
            obsidian \
            plugins/skillz \
            skills/*/SKILL.md \
            skills/*/agents/openai.yaml
          git commit -m "Regenerate skill repository artifacts"
          git push origin HEAD:"$GITHUB_REF_NAME"

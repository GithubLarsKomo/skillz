name: Materialize EUROIMMUN report renderers

on:
  push:
    branches: [feat/euroimmun-report-renderers]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/euroimmun-report-renderers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template dependencies
        run: python -m pip install python-docx pillow
      - name: Build bundled DOCX template
        run: python skills/euroimmun-docx-report-renderer/scripts/build_template.py
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build OpenAI plugin distribution
        run: python scripts/build_openai_plugin.py --output plugins/skillz
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: materialize EUROIMMUN report renderer artifacts"
          git push origin HEAD:feat/euroimmun-report-renderers

name: Temporary materialize OpenAI agent metadata

on:
  push:
    branches: [agent/capability-index-openai-policy-audit]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[openai metadata generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/capability-index-openai-policy-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize residual-risk output contracts
        shell: python
        run: |
          from pathlib import Path
          mapping = {
              "disciplined-diagnosis": "diagnosis-residual-risk-handoff.json",
              "implement-from-issue": "implementation-residual-risk-handoff.json",
              "merge-conflict-resolution": "conflict-residual-risk-handoff.json",
              "test-driven-vertical-slice": "vertical-slice-residual-risk-handoff.json",
          }
          for slug, replacement in mapping.items():
              path = Path("skills") / slug / "SKILL.md"
              text = path.read_text(encoding="utf-8")
              text = text.replace("residual-risk-handoff.json", replacement)
              path.write_text(text, encoding="utf-8", newline="\n")
      - name: Materialize per-skill OpenAI metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Regenerate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Commit generated metadata
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard docs/CAPABILITY-HEALTH.md)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+41898282@users.noreply.github.com"
          git add skills README.md .skill-sync.json docs/SKILL-DEPENDENCIES.md docs/skill-dependency-graph.json docs/skill-capability-index.json docs/CAPABILITY-HEALTH.md
          git commit -m "Materialize per-skill OpenAI metadata [openai metadata generated]"
          git push origin HEAD:agent/capability-index-openai-policy-audit

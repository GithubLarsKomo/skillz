name: EUROIMMUN report contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test EUROIMMUN corporate design contract
        run: python -m unittest tests.test_euroimmun_corporate_design_contract
      - name: Test EUROIMMUN corporate design golden reference
        run: python -m unittest tests.test_euroimmun_corporate_design_golden_reference
      - name: Test EUROIMMUN DOCX PDF Level-2 reference
        run: python -m unittest tests.test_euroimmun_docx_pdf_level2_reference

name: Materialize Sport P1 metadata

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: materialize-sport-p1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'feat/sport-athlete-management-p1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sport-athlete-management-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize OpenAI agent metadata
        run: python scripts/materialize_openai_agent_metadata.py
      - name: Generate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Build committed OpenAI plugin bundle
        shell: bash
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$SOURCE_COMMIT"
      - name: Verify generated outputs
        run: |
          python scripts/materialize_openai_agent_metadata.py --check
          python scripts/generate_repository_metadata.py --check
          python scripts/validate_skills.py
          python scripts/evaluate_skills.py
          python -m unittest tests.test_sport_p1_contracts
      - name: Restore normal workflow scope and remove one-shot workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/sync-generated-metadata.yml
          git rm .github/workflows/materialize-sport-p1.yml
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate P1 sport athlete management artifacts"
          git push origin HEAD:feat/sport-athlete-management-p1

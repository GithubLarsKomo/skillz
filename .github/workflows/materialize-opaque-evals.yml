name: Temporary opaque evaluation metadata materializer

on:
  push:
    branches: [agent/opaque-system-analysis-evals]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opaque-system-analysis-evals
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate repository metadata
        run: |
          set -euo pipefail
          python scripts/generate_repository_metadata.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .skill-sync.json docs/skill-dependency-graph.json docs/SKILL-DEPENDENCIES.md docs/skill-capability-index.json
          if ! git diff --cached --quiet; then
            git commit -m "generate opaque analysis evaluation metadata"
            git push origin HEAD:agent/opaque-system-analysis-evals
          fi

name: Materialize sport parity bundle

on:
  push:
    branches:
      - feat/sport-docx-pdf-report-pipeline

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sport-docx-pdf-report-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize generated bundle and metadata
        run: |
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .skill-sync.json README.md docs plugins/skillz
          if ! git diff --cached --quiet; then
            git commit -m "chore: materialize sport parity bundle"
            git push origin HEAD:feat/sport-docx-pdf-report-pipeline
          fi

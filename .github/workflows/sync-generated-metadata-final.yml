name: Sync generated metadata final

on:
  push:
    branches:
      - feat/impeccable-corporate-color-palettes

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/impeccable-corporate-color-palettes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate repository metadata
        run: python scripts/generate_repository_metadata.py
      - name: Commit generated outputs
        run: |
          if git diff --quiet; then
            echo "Generated metadata already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate repository metadata after evaluation repair"
          git push origin HEAD:feat/impeccable-corporate-color-palettes

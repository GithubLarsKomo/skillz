name: Materialize Teach ETF adapters

on:
  push:
    branches: [feat/teach-etf-adapters]
    paths:
      - ".teach-etf-adapters-materialize"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/teach-etf-adapters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize canonical repository artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          python scripts/materialize_openai_agent_metadata.py
          python scripts/generate_repository_metadata.py
          python scripts/build_openai_plugin.py --output plugins/skillz --source-commit "$source_commit"
          python scripts/materialize_openai_agent_metadata.py --check
          python scripts/generate_repository_metadata.py --check
          python scripts/validate_skills.py
          python scripts/evaluate_skills.py
          python -m unittest tests.test_bootstrap_skillz
      - name: Commit generated artifacts
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            .skill-sync.json \
            docs/skill-dependency-graph.json \
            docs/SKILL-DEPENDENCIES.md \
            docs/skill-capability-index.json \
            docs/CAPABILITY-HEALTH.md \
            obsidian \
            plugins/skillz \
            skills/*/SKILL.md \
            skills/*/agents/openai.yaml
          git commit -m "Regenerate Teach ETF adapter artifacts"
          git push origin HEAD:feat/teach-etf-adapters
